[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "althaqeb"
version = "0.2.0.dev0"
description = "Agent memory residue forensics — does deletion equal erasure in LLM/vector-DB memory?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "0xMsecurity", email = "msecuritybh@gmail.com" }
]
keywords = ["ai-security", "agent-memory", "vector-database", "forensics", "embedding-inversion", "vec2text", "hnsw"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# Runtime deps for the experiments are pinned in requirements.txt
# (torch needs the CPU index; transformers must stay < 4.50 for vec2text).
dependencies = []

[project.urls]
Homepage = "https://github.com/0xMsecurity/althaqeb"
Repository = "https://github.com/0xMsecurity/althaqeb"
"Bug Tracker" = "https://github.com/0xMsecurity/althaqeb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lethe*"]
