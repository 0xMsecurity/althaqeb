[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdbresidue"
version = "0.1.0"
description = "Read-only forensic auditor for deleted-vector residue in vector databases (VEDC erasure-verification reference tool)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["forensics", "dfir", "gdpr", "erasure", "vector-database", "embeddings", "vedc"]
authors = [{ name = "Althaqeb" }]
# Core auditor is dependency-light by design (read-only file forensics). numpy is the only
# hard runtime need for vector math; engine clients are NOT required to audit on-disk files.
dependencies = ["numpy>=1.24"]

[project.urls]
Standard = "https://example.invalid/vedc"  # TODO(human): set on publish — VEDC SPEC URL
Source = "https://example.invalid/althaqeb" # TODO(human): set on publish

[project.scripts]
vdbresidue = "vdbresidue:main"

[tool.setuptools]
py-modules = ["vdbresidue"]
